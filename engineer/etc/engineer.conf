# Engineer settings: droplet defaults. Read by bash (`. <root>/etc/engineer.conf`) and by
# eng.conf.load(root). Format: KEY=VALUE or KEY="VALUE"; `#` comments; no `$`, backticks or `~`.
# Tests rewrite every path into a temp dir (tests/engineer/testlib.py make_root).

# State, written by the supervisor (mirrors: by the broker); not writable by engineer
STATE_DIR=/var/lib/engineer
SPOOL_DIR=/var/lib/engineer/spool
RECORDS_DIR=/var/lib/engineer/records
KILL_SWITCH=/var/lib/engineer/STOP
MIRROR_DIR=/var/lib/engineer/mirrors

# Projects and root-owned config
PROJECTS_DIR=/home/engineer/projects
ETC_DIR=/etc/engineer
MANAGED_SETTINGS=/etc/claude-code/managed-settings.json

# Browser route
CHROME_PROFILE=/home/engineer/.engineer/chrome-profile
DISPLAY=:99
NOVNC_PORT=6080
PROXY_PORT=3128

# Secret broker (SOPS+age)
BROKER_USER=secretbroker
SECRETS_FILE=/home/secretbroker/secrets.enc.json
AGE_KEY_FILE=/home/secretbroker/.config/sops/age/keys.txt
AGE_RECIPIENT_FILE=/home/secretbroker/.config/sops/age/recipient.txt
BROKER_STATE_DIR=/home/secretbroker/state

# Time, identity, endpoints
TZ_NAME=America/New_York
BOT_EMAIL=engineer-bot@users.noreply.github.com
TELEGRAM_API=https://api.telegram.org
GITHUB_URL=https://github.com

# Commands the supervisor runs
RUN_TASK="sudo -n -u engineer /opt/engineer/bin/run-task"
AGENT_RUN="sudo -n -u secretbroker /opt/engineer/bin/agent-run"
AUDIT_CMD=/opt/engineer/scripts/checks/audit.sh
